

name: fastsam-backend-dev

services:
  fastsam-backend:
    container_name: fastsam-backend-dev
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV:-production}
    image: gavinlouuu/fastsam-backend:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    env_file:
      - .env.development
    environment:
      - USE_ORG_MIDDLEWARE=true
      - LOG_LEVEL=DEBUG
      - HTTP_PROXY=http://tailscale-proxy:1055
      - HTTPS_PROXY=http://tailscale-proxy:1055
      - ALL_PROXY=socks5://tailscale-proxy:1055
      - NO_PROXY=localhost,127.0.0.1,db-dev,label-studio-app-dev,label-studio-nginx-dev
    ports:
      - "9096:9090"
    volumes:
      - "./data/server-dev:/data"
      - "./.env.development:/app/.env:ro"
    networks:
      label-studio-dev-network:
        aliases:
          - fastsam-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  label-studio-dev-network:
    external: true
