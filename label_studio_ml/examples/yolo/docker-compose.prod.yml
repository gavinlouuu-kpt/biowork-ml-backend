name: yolo-backend-prod

services:
  yolo:
    container_name: yolo-backend
    image: humansignal/yolo:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      - LOG_LEVEL=DEBUG
      - ANY=PARAMETER
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
      - PYTHONPATH=/app
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://label-studio-nginx:8085}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - ALLOW_CUSTOM_MODEL_PATH=true
      - DEBUG_PLOT=false
      - MODEL_SCORE_THRESHOLD=0.5
      - MODEL_ROOT=/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
    ports:
      - "9095:9090"
    volumes:
      - "./data/server:/data"
      - "./models:/app/models"
      - "./cache_dir:/app/cache_dir"
    networks:
      label-studio-network:
        aliases:
          - yolo-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  label-studio-network:
    external: true
