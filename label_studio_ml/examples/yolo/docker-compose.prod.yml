name: yolo-backend-prod

services:
  yolo:
    container_name: yolo-backend
    image: humansignal/yolo:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      - LOG_LEVEL=DEBUG
      - ANY=PARAMETER
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
      - PYTHONPATH=/app
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://label-studio-nginx:8085}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - ALLOW_CUSTOM_MODEL_PATH=true
      - DEBUG_PLOT=false
      - MODEL_SCORE_THRESHOLD=0.5
      - MODEL_ROOT=/app/models
      - YOLO_TRAIN_PROJECT_ROOT=/data/server/yolo_autotrain
      - YOLO_TRAIN_EPOCHS=${YOLO_TRAIN_EPOCHS:-25}
      - YOLO_TRAIN_IMGSZ=${YOLO_TRAIN_IMGSZ:-1024}
      - YOLO_TRAIN_BATCH=${YOLO_TRAIN_BATCH:-8}
      - YOLO_TRAIN_WORKERS=${YOLO_TRAIN_WORKERS:-2}
      - YOLO_TRAIN_PATIENCE=${YOLO_TRAIN_PATIENCE:-20}
      - YOLO_TRAIN_BASE_MODEL_DETECT=${YOLO_TRAIN_BASE_MODEL_DETECT:-yolov8m.pt}
      - YOLO_TRAIN_BASE_MODEL_SEGMENT=${YOLO_TRAIN_BASE_MODEL_SEGMENT:-yolov8n-seg.pt}
      - YOLO_TRAIN_MLFLOW_ENABLED=${YOLO_TRAIN_MLFLOW_ENABLED:-true}
      - YOLO_TRAIN_MLFLOW_EXPERIMENT=${YOLO_TRAIN_MLFLOW_EXPERIMENT:-biowork-yolo-training}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MLFLOW_ARTIFACT_ROOT=${MLFLOW_ARTIFACT_ROOT:-mlflow-artifacts:/biowork}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL:-https://rustfs-api.himalayan-coho.ts.net}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-https://rustfs-api.himalayan-coho.ts.net}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
    ports:
      - "9095:9090"
    volumes:
      - "./data/server:/data"
      - "./models:/app/models"
      - "./cache_dir:/app/cache_dir"
    networks:
      label-studio-network:
        aliases:
          - yolo-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  label-studio-network:
    external: true
