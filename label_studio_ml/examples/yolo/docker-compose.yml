name: yolo-backend-dev

services:
  yolo:
    container_name: yolo-backend-dev
    image: humansignal/yolo:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    env_file:
      - .env.development
    environment:
      # Organization middleware toggle
      - USE_ORG_MIDDLEWARE=true

      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      # set the log level for the model server
      - LOG_LEVEL=DEBUG
      # any other parameters that you want to pass to the model server
      - ANY=PARAMETER
      # specify the number of workers and threads for the model server
      - WORKERS=1
      - THREADS=8
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=/data/models
      - PYTHONPATH=/app

      # Label Studio connection
      # The middleware auto-resolves API tokens from the Label Studio database,
      # so LABEL_STUDIO_API_KEY is not needed when USE_ORG_MIDDLEWARE=true.
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://label-studio-app-dev:8000}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}

      # Middleware database connection (PostgreSQL)
      - LABEL_STUDIO_DB_TYPE=${LABEL_STUDIO_DB_TYPE:-postgres}
      - LABEL_STUDIO_DB_HOST=${LABEL_STUDIO_DB_HOST:-db-dev}
      - LABEL_STUDIO_DB_PORT=${LABEL_STUDIO_DB_PORT:-5432}
      - LABEL_STUDIO_DB_NAME=${LABEL_STUDIO_DB_NAME:-postgres}
      - LABEL_STUDIO_DB_USER=${LABEL_STUDIO_DB_USER:-postgres}
      - LABEL_STUDIO_DB_PASSWORD=${LABEL_STUDIO_DB_PASSWORD:-postgres}

      # YOLO parameters

      # Allow to use custom `model_path` in labeling configurations
      - ALLOW_CUSTOM_MODEL_PATH=true
      # Show matplotlib debug plot for YOLO predictions
      - DEBUG_PLOT=false
      # Default score threshold, which is used to filter out low-confidence predictions,
      # you can change it in the labeling configuration using `model_score_threshold` parameter in the control tags
      - MODEL_SCORE_THRESHOLD=0.5
      # Model root directory, where the YOLO model files are stored
      - MODEL_ROOT=/app/models

      # YOLO training parameters
      - YOLO_TRAIN_PROJECT_ROOT=/data/server/yolo_autotrain
      - YOLO_TRAIN_EPOCHS=${YOLO_TRAIN_EPOCHS:-25}
      - YOLO_TRAIN_IMGSZ=${YOLO_TRAIN_IMGSZ:-1024}
      - YOLO_TRAIN_BATCH=${YOLO_TRAIN_BATCH:-8}
      - YOLO_TRAIN_WORKERS=${YOLO_TRAIN_WORKERS:-2}
      - YOLO_TRAIN_PATIENCE=${YOLO_TRAIN_PATIENCE:-20}
      - YOLO_TRAIN_BASE_MODEL_DETECT=${YOLO_TRAIN_BASE_MODEL_DETECT:-yolov8m.pt}
      - YOLO_TRAIN_BASE_MODEL_SEGMENT=${YOLO_TRAIN_BASE_MODEL_SEGMENT:-yolov8n-seg.pt}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # for macos and unix      
    gpus: all
    ports:
      - "9094:9090"
    volumes:
      - "./data/server:/data"
      - "./models:/app/models"
      - "./cache_dir:/app/cache_dir"
    networks:
      label-studio-dev-network:
        aliases:
          - yolo-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  label-studio-dev-network:
    external: true
