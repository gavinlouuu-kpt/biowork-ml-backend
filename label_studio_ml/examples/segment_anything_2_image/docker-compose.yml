name: sam2-backend-dev
services:
  sam2-backend:
    container_name: sam2-backend-dev
    image: gavinlouuu/sam2-backend:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]


    env_file:
      - .env.development
    ports:
      - "9091:9090"
    volumes:
      - "./data/server-dev:/data"
    networks:
      label-studio-dev-network:
        aliases:
          - sam2-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  label-studio-dev-network:
    external: true
